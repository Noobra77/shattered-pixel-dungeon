name: Build modded SPD
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get game v4.0.2 and apply the mod zip
        run: |
          git clone --depth 1 --branch v4.0.2 https://github.com/00-Evan/shattered-pixel-dungeon.git game
          unzip -o spd-mod-overlay.zip -d game
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: game
        run: ./gradlew android:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SPD-mod-apk
          path: game/android/build/outputs/apk/debug/*.apk